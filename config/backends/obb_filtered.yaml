# Contour-based estimator, zero additional insertion, shared point-cloud filters.
# workspace_camera is optical-camera XYZ in meters; mount profile is 640x480.
depth_quantile: 0.5
# Explicit per-run override: --insertion-depth-mm 5. Applied once along tool +X.
insertion_depth_m: 0.0
min_depth_m: 0.05
max_depth_m: 1.0
outlier_filter:
  nb_neighbors: 20
  std_ratio: 2.0
workspace_camera:
  min_m:
  - -0.25
  - -0.2
  - 0.1
  max_m:
  - 0.25
  - 0.2
  - 0.6
gripper_exclusion:
  reference_resolution:
  - 640
  - 480
  polygons_uv:
  - - - 0.49
      - 0.63
    - - 0.56
      - 0.63
    - - 0.68
      - 0.77
    - - 0.8
      - 1.0
    - - 0.35
      - 1.0
    - - 0.38
      - 0.85
  min_depth_m: 0.05
  max_depth_m: 0.19
pointcloud_quality:
  min_scene_points: 1000
  min_target_points: 300
  min_valid_depth_ratio: 0.6
  min_retained_ratio: 0.5
  max_outlier_ratio: 0.2
